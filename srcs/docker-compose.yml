services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb-inception
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
      - db_admin_password
  wordpress:
    build: ./requirements/wordpress
    image: wp-inception
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    secrets:
      - db_password
      - wp_admin_password
  nginx:
    build: ./requirements/nginx
    image: nginx-inception
    container_name: nginx
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    ports:
      - "443:443"
    secrets:
      - nginx_key
         

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sal-qur/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sal-qur/data/wordpress
networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  nginx_key:
    file: ../secrets/nginx.key
